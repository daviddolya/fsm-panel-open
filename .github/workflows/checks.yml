name: Checks
on: [push, pull_request]
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm --dir worker install --frozen-lockfile
      - run: pnpm --dir worker build
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest -m "not stand and not postgres" --junitxml=test-results/python.xml --cov=fsm_panel.core --cov-branch --cov-report=json:test-results/core-coverage.json
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run python scripts/check_branch_coverage.py test-results/core-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: test-results/
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fsm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run pytest tests/licensing/test_postgres.py tests/qa/test_license_failure_boundaries.py -m postgres
        env:
          FSM_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/fsm_test
  worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm --dir worker install --frozen-lockfile
      - run: pnpm --dir worker typecheck
      - run: pnpm --dir worker test
      - run: pnpm --dir worker build
  package:
    needs: [python, postgres, worker]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/build_desktop.py --research-build
      - run: uv run python scripts/verify_desktop.py dist/FSMPanelOpen/FSMPanelOpen.exe --output test-results/packaged-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: FSMPanelOpen-research-windows
          path: |
            dist/FSMPanelOpen/
            test-results/packaged-smoke.json
